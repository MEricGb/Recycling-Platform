<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-tabs {
      display: flex;
      gap: 0.5em;
      margin-bottom: 1.5em;
      flex-wrap: wrap;
    }
    .admin-tabs button {
      flex: 1;
      min-width: 120px;
      background: #e0e0e0;
      color: #333;
    }
    .admin-tabs button.active {
      background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
      color: white;
    }
    .admin-section {
      display: none;
    }
    .admin-section.active {
      display: block;
    }
    .delete-btn {
      background: linear-gradient(135deg, #ef5350 0%, #e53935 100%) !important;
      max-width: 100px;
      padding: 0.5em;
      font-size: 0.9em;
    }
    .item-card {
      background: #f5f5f5;
      padding: 1em;
      border-radius: 8px;
      margin-bottom: 0.8em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5em;
    }
    .item-info {
      flex: 1;
    }
    .admin-badge {
      background: #ffc107;
      color: #333;
      padding: 0.2em 0.5em;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Platforma de Reciclare</h1>
    <nav>
      <ul>
        <li><a href="index.html">Acasă</a></li>
        <li><a href="educatie.html">Educație</a></li>
        <li><a href="reciclare.html">Reciclare</a></li>
        <li><a href="evenimente.html">Evenimente</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="clasament.html">Clasament</a></li>
        <li><a href="profil.html">Profil</a></li>
        <li><a href="admin.html" class="active">Admin</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h2>Panou de Administrare</h2>

    <!-- Tabs -->
    <div class="admin-tabs">
      <button class="active" onclick="showSection('questions')">Întrebări Quiz</button>
      <button onclick="showSection('events')">Evenimente</button>
      <button onclick="showSection('users')">Utilizatori</button>
    </div>

    <!-- QUESTIONS SECTION -->
    <div id="questions-section" class="admin-section active">
      <section class="info-card">
        <h3>Adaugă întrebare nouă</h3>
        <form id="add-question-form">
          <input type="text" name="question" placeholder="Întrebarea..." required>
          <input type="text" name="answer_a" placeholder="Răspuns A" required>
          <input type="text" name="answer_b" placeholder="Răspuns B" required>
          <input type="text" name="answer_c" placeholder="Răspuns C" required>
          <input type="text" name="answer_d" placeholder="Răspuns D" required>
          <label>Răspuns corect:</label>
          <select name="correct" required>
            <option value="0">A</option>
            <option value="1">B</option>
            <option value="2">C</option>
            <option value="3">D</option>
          </select>
          <button type="submit">Adaugă întrebare</button>
        </form>
      </section>
      <section class="info-card">
        <h3>Întrebări existente</h3>
        <div id="questions-list"></div>
      </section>
    </div>

    <!-- EVENTS SECTION -->
    <div id="events-section" class="admin-section">
      <section class="info-card">
        <h3>Adaugă eveniment nou</h3>
        <form id="add-event-form">
          <input type="text" name="title" placeholder="Titlu eveniment" required>
          <input type="date" name="date" required>
          <input type="text" name="location" placeholder="Locație" required>
          <button type="submit">Adaugă eveniment</button>
        </form>
      </section>
      <section class="info-card">
        <h3>Evenimente existente</h3>
        <div id="events-list"></div>
      </section>
    </div>

    <!-- USERS SECTION -->
    <div id="users-section" class="admin-section">
      <section class="info-card">
        <h3>Utilizatori înregistrați</h3>
        <div id="users-list"></div>
      </section>
    </div>

  </main>
  <footer>
    <p>&copy; 2025 Platforma Reciclare</p>
  </footer>
  <script src="js/admin.js" defer></script>
</body>
</html>
